# Builds kosko-assist as a single executable for Windows x64, macOS arm64 and macOS x64, and attaches the three files to
# a GitHub release (Kosko 538). Each build is made on its own platform's GitHub-hosted runner, because Node's single
# executable is a copy of THAT runner's node binary, and each is run through test/sea/ there before it is uploaded.
# The files are unsigned (an ad-hoc signature on macOS, no identity); the README's Download section says how to open them.
#
# Release: bump package.json's version, commit, push, then push a tag `v<version>`. Nothing else starts this workflow.
name: release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            exe: kosko-assist-windows-x64.exe
          - runner: macos-latest
            exe: kosko-assist-macos-arm64
          - runner: macos-15-intel
            exe: kosko-assist-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Tag matches the package version
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match $want"; exit 1; }
      - run: npm ci
      # Builds dist/<exe> with this runner's node, then runs it: --version, --help, accounts, a dry run of the
      # synthetic account and every ENML sample, each compared with the source.
      - run: npm run test:sea
      - name: The executable has the expected name
        shell: bash
        env:
          EXE: ${{ matrix.exe }}
        run: test -f "dist/$EXE" && test -f "dist/$EXE.sha256" && node -v > "dist/$EXE.node-version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.exe }}
          path: |
            dist/${{ matrix.exe }}
            dist/${{ matrix.exe }}.sha256
            dist/${{ matrix.exe }}.node-version
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files; this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          cat ./*.sha256 > SHA256SUMS.txt
          node_version="$(cat ./*.node-version | sort -u | tr '\n' ' ')"
          rm ./*.sha256 ./*.node-version
          ls -la
          notes="Unsigned builds of kosko-assist, made from ${GITHUB_SHA} with Node.js ${node_version}.
          Windows: SmartScreen shows \"Windows protected your PC\"; choose More info, then Run anyway.
          macOS: the first open is blocked; open System Settings, Privacy & Security, and choose Open Anyway.
          Check a download against SHA256SUMS.txt. Signed installers come before the public launch."
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "$notes" --prerelease --verify-tag
